<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Webpage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .navbar {
            display: flex;
            justify-content: space-around;
            background-color: #333;
            color: white;
            padding: 10px 0;
            position: fixed;
            width: 100%;
            z-index: 1000;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            text-align: center;
        }
        .navbar a:hover {
            text-decoration: underline;
        }
        .content {
            padding: 60px 20px; /* Add padding to avoid overlap with navbar */
        }
        @media (max-width: 768px) {
            .navbar {
                bottom: 0;
                top: auto;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="#home">🏠 Home</a>
        <a href="#training">📅 Training</a>
        <a href="#nutrition">🥕 Nutrition</a>
        <a href="#fitness">📈 Fitness</a>
        <a href="#pbs">🏆 PBS</a>
        <a href="#settings">⚙️ Settings</a>
    </div>

    <div class="content">
        <h1>Welcome to Your Dashboard</h1>
        <p>This is a sample webpage with a navigation bar.</p>
        <p>Scroll down to see more content.</p>
    </div>

</body>
</html>
